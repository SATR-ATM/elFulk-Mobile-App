name: elfulk
description: "ElFulk mobile app"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.8

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.9
  firebase_core: ^4.5.0
  flutter_native_splash: ^2.4.7
  dio: ^5.9.2
  retrofit: ^4.9.1
  pretty_dio_logger: ^1.4.0
  get_it: ^9.0.5
  go_router: ^17.1.0
  flutter_bloc: ^9.1.1
  flutter_screenutil: ^5.9.3
  freezed_annotation: ^3.1.0
  intl: ^0.20.2
  json_annotation: ^4.11.0
  flutter_secure_storage: ^10.0.0
  shared_preferences: ^2.5.3
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.10.4
  freezed: ^3.2.5
  json_serializable: ^6.13.0
  retrofit_generator: ^10.2.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
