name: elfulk
description: "ElFulk mobile app"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.9
  flutter_svg: ^2.3.0
  firebase_core: ^4.14.0
  flutter_native_splash: ^2.4.8
  dio: ^5.11.0
  retrofit: ^4.10.0
  pretty_dio_logger: ^1.4.0
  get_it: ^9.0.5
  go_router: ^17.1.0
  flutter_bloc: ^9.1.1
  flutter_screenutil: ^5.9.3
  freezed_annotation: ^3.1.0
  intl: ^0.20.3
  json_annotation: ^4.12.0
  flutter_secure_storage: ^10.0.0
  shared_preferences: ^2.5.5
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.15.1
  freezed: ^3.2.5
  json_serializable: ^6.14.1
  retrofit_generator: ^10.2.9
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
    


